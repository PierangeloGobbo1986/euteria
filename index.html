<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1214">
<title>EUTERIA Web</title>
<style>
  :root { --bg:#0e1214; --panel:#151a1d; --text:#edf0ec; --muted:#8e9a9a; --gold:#d6a85f; --border:#30383d; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; justify-content:center;
    padding:32px max(16px, env(safe-area-inset-left)); max-width:640px; margin:0 auto; }
  h1 { font-size:40px; font-weight:800; letter-spacing:.04em; margin:0 0 6px; }
  p { color:var(--muted); font-size:16px; line-height:1.5; margin:0 0 10px; }
  .tag { display:inline-block; margin-top:14px; padding:6px 12px; border:1px solid var(--gold);
    color:var(--gold); border-radius:999px; font-size:13px; font-weight:600; width:max-content; }
  footer { color:#697471; font-size:12px; margin-top:28px; }
</style>
</head>
<body>
<main>
  <h1>EUTERIA</h1>
  <p>Practise with the separated parts of a song: choose the instruments, change tempo and key, loop a passage, follow the bars and the chords.</p>
  <span class="tag">In development</span>
  <p style="margin-top:22px"><a href="lab/" style="color:#6bb7aa;font-weight:600">Open the Phase 0 test page →</a></p>
  <footer>&copy; 2026 Pierangelo Gobbo. All rights reserved.</footer>
</main>
</body>
</html>
